version: 2
updates:
  # ─── npm ──────────────────────────────────────────────────────────
  # ONE entry for the whole monorepo. The root `package-lock.json`
  # holds every workspace's resolved tree (npm workspaces stores
  # transitively at the root, not per-app). Per-app Dependabot entries
  # would only update the workspace manifest and leave the root
  # lockfile out of sync — `npm ci` then fails on every CI run with
  # "Missing: <pkg> from lock file". Keep this as a single root entry.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Qatar"
    open-pull-requests-limit: 15
    commit-message:
      prefix: "chore(deps)"
    # MAJOR versions we cannot take yet. Each of these opened PRs that fail CI
    # (2026-10-21: #620-#627, and #694's jwt/passport half) and bury the real
    # security PRs in noise. Minor/patch updates for these packages still flow.
    ignore:
      # NestJS 12 must be ONE coordinated migration, not eight separate bumps.
      # Dependabot bumps each @nestjs/* package alone, which leaves mixed
      # 11/12 versions: unit tests fail with "Cannot use import statement
      # outside a module" (12.x is ESM; the API is CommonJS) and E2E fails with
      # "Cannot find module '@nestjs/common/internal'" (#620-#627, #694).
      # Upstream peers (@nestjs/throttler 6.7.1, @sentry/nestjs) already allow
      # 12 as of 2026-10-21, so the remaining work is ours: ESM/CJS plan first.
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      # eslint 10 fails the repo's Lint job (#626); needs its own config work.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    # Dependabot assigns each update to the FIRST group that matches it, so the
    # specific groups must come BEFORE the catch-all. With minor-and-patch first
    # (as it was), it swallowed everything: #705 (2026-10-21) bundled next
    # 16.3.8 -> 16.4.2, react 19.2 -> 19.3 and svix 2.0 -> 2.8 with 150 other
    # packages and failed CI, and the next-react / security-critical groups
    # could never trigger for minor/patch updates.
    groups:
      # Security-critical runtime deps, one reviewable PR (kept apart from the
      # catch-all). svix / standardwebhooks / resend sit on the webhook
      # signature-verification and email paths.
      security-critical:
        patterns:
          - "bcrypt"
          - "helmet"
          - "cookie-parser"
          - "@nestjs/jwt"
          - "@nestjs/passport"
          - "passport*"
          - "jsonwebtoken"
          - "@nestjs/throttler"
          - "class-validator"
          - "class-transformer"
          - "sharp"
          - "file-type"
          - "multer"
          - "@prisma/client"
          - "prisma"
          - "@aws-sdk/*"
          - "svix"
          - "standardwebhooks"
          - "resend"
      # Frontend framework grouped — Next + React always bumped together, and
      # kept out of the catch-all (a Next minor is a deliberate upgrade).
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"
          - "@next/*"
          - "@types/react*"
      # Everything else, minor/patch only. MUST stay last.
      minor-and-patch:
        update-types: ["minor", "patch"]

  # ─── GitHub Actions (supply chain) ────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(actions)"

  # ─── Docker base images ───────────────────────────────────────────
  # Each Dockerfile is its own entry. Dependabot updates the FROM
  # SHA pin (e.g. `node:22-alpine@sha256:...`) when a new digest
  # publishes for the same tag — keeps the supply chain pinned but
  # fresh. Major version bumps (node:22 -> node:25) come as separate
  # PRs and are reviewed by hand.
  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
