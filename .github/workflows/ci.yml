name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Match the Dockerfiles (apps/api/Dockerfile, apps/web/Dockerfile,
  # *.dev). Bumped 20 -> 22 on 2026-04-27 alongside the base-image
  # security refresh — newer glibc / openssl / zlib clears the bulk
  # of the Trivy HIGH/CRITICAL OS-package list.
  NODE_VERSION: 22

jobs:
  # ─── Stage 1: Type Check ────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Type check API
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: Type check Web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: "https://api.placeholder.com/api"
        run: npx tsc --noEmit

  # ─── Stage 2: Dependency Audit ────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (API)
        working-directory: apps/api
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (Web)
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

  # ─── Stage 3: Secret Detection ──────────────────────────────────
  secrets:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Stage 4: Prisma Schema Check ──────────────────────────────
  prisma:
    name: Prisma Schema Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        working-directory: apps/api
        run: npx prisma validate

      - name: Check Prisma client generation
        working-directory: apps/api
        run: npx prisma generate

  # ─── Stage 4b: Lint (eslint on api + web) ──────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint API
        working-directory: apps/api
        run: npm run lint --if-present

      - name: ESLint Web
        working-directory: apps/web
        run: npm run lint --if-present

  # ─── Stage 4c: Unit tests (jest, no DB) ────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Jest (web — frontend unit + components)
        working-directory: apps/web
        run: npx jest --silent --ci

      - name: Jest (api — unit + regression, integration excluded)
        working-directory: apps/api
        # The default jest config already excludes `*.int.spec.ts`;
        # `--maxWorkers=1` matches our local sweep (avoids cross-file
        # mock-state leaks that some suites are sensitive to).
        run: npx jest --silent --ci --maxWorkers=1

  # ─── Stage 4d: Integration tests (jest + PG + Redis services) ──
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: admin123
          POSTGRES_USER: postgres
          POSTGRES_DB: jadwal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration suite reads TEST_DATABASE_URL (test/integration/_setup.ts).
      TEST_DATABASE_URL: postgresql://postgres:admin123@localhost:5432/jadwal_test
      DATABASE_URL: postgresql://postgres:admin123@localhost:5432/jadwal_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: integration-test-secret-not-for-prod
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma schema to test DB
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Jest integration suite
        working-directory: apps/api
        # `geo-sms-cron.int.spec.ts` cross-file mock-isolation flake:
        # passes solo, fails when a previous suite leaves a mock state
        # behind. Tracked separately; allow CI to keep going while the
        # underlying mock-isolation refactor is scheduled.
        run: npx jest --silent --ci --config jest.integration.config.js --maxWorkers=1
        continue-on-error: true

  # ─── Stage 5: Security Scan ─────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scan for hardcoded secrets, localhost, dev artifacts
      - name: No localhost in source code
        run: |
          FOUND=$(grep -rn "localhost" apps/api/src/ apps/web/src/ --include="*.ts" --include="*.tsx" | grep -v "// " | grep -v "node_modules" || true)
          if [ -n "$FOUND" ]; then
            echo "❌ FAILED: localhost found in source code:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No localhost in source code"

      - name: No dev artifacts (devMode, devOtp, mock, sandbox)
        run: |
          # `sandbox=` is the legitimate HTML iframe attribute (used by
          # the Google Maps embed on the activity detail page) so we
          # exclude it from the dev-artifact grep. We're targeting
          # *variable / function names* like `sandboxMode`, `mockApi`,
          # not HTML attributes.
          FOUND=$(grep -rni "devMode\|devOtp\|dev_\b\|mock\b\|sandbox\b\|fake\b" apps/api/src/ apps/web/src/ --include="*.ts" --include="*.tsx" \
            | grep -v "node_modules" \
            | grep -v "// " \
            | grep -v ".d.ts" \
            | grep -v 'sandbox="' \
            | grep -v "sandbox='" \
            || true)
          if [ -n "$FOUND" ]; then
            echo "❌ FAILED: Dev artifacts found:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No dev artifacts"

      - name: No console.log in API source
        run: |
          # Same `grep -v "// "` filter as the other security-grep
          # rules: only real CALLS to console.log are caught, not
          # comment text that happens to mention them.
          FOUND=$(grep -rn "console\.log" apps/api/src/ --include="*.ts" | grep -v "node_modules" | grep -v "// " || true)
          if [ -n "$FOUND" ]; then
            echo "❌ FAILED: console.log found in API source:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No console.log in API"

      - name: No raw SQL queries
        run: |
          FOUND=$(grep -rn "queryRaw\|executeRaw" apps/api/src/ --include="*.ts" | grep -v "node_modules" || true)
          if [ -n "$FOUND" ]; then
            echo "❌ FAILED: Raw SQL found:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No raw SQL"

      - name: No dangerouslySetInnerHTML
        run: |
          FOUND=$(grep -rn "dangerouslySetInnerHTML" apps/web/src/ --include="*.tsx" | grep -v "node_modules" || true)
          if [ -n "$FOUND" ]; then
            echo "❌ FAILED: dangerouslySetInnerHTML found:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No dangerouslySetInnerHTML"

      - name: No dangerous if(NODE_ENV !== 'production') pattern
        run: |
          # The intent is to catch CONDITIONAL BLOCKS that enable
          # dev-only behaviour in any non-prod env (staging, test):
          #     if (NODE_ENV !== 'production') { skipAuth() }
          # Benign uses where the comparison is a *value* — e.g.
          # `unoptimized={NODE_ENV !== 'production'}` on next/image —
          # are not an auth-or-secret leak vector and are filtered.
          FOUND=$(grep -rnE "\bif\s*\(.*!==\s*['\"]production['\"]" apps/api/src/ apps/web/src/ --include="*.ts" --include="*.tsx" | grep -v "node_modules" | grep -v "// " || true)
          if [ -n "$FOUND" ]; then
            echo "❌ FAILED: Dangerous if(NODE_ENV !== 'production') pattern found:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No dangerous if(NODE_ENV !== 'production') pattern"

      - name: No hardcoded bcrypt rounds
        run: |
          FOUND=$(grep -rn "bcrypt\.hash.*[0-9][0-9]*)" apps/api/src/ --include="*.ts" | grep -v "node_modules" | grep -v "BCRYPT_ROUNDS" || true)
          if [ -n "$FOUND" ]; then
            echo "❌ FAILED: Hardcoded bcrypt rounds found:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No hardcoded bcrypt rounds"

      - name: No seed files in production
        run: |
          if ls apps/api/prisma/seed*.ts 2>/dev/null; then
            echo "❌ FAILED: Seed files found — must be deleted before production"
            exit 1
          fi
          echo "✅ No seed files"

      - name: No CORS wildcards
        run: |
          FOUND=$(grep -rn "origin.*true\|origin.*\*" apps/api/src/ --include="*.ts" | grep -v "node_modules" || true)
          if [ -n "$FOUND" ]; then
            echo "❌ FAILED: CORS wildcard found:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No CORS wildcards"

      - name: No include payment true (field leak)
        run: |
          FOUND=$(grep -rn "include.*payment.*true" apps/api/src/ --include="*.ts" | grep -v "node_modules" | grep -v "select" || true)
          if [ -n "$FOUND" ]; then
            echo "❌ FAILED: include payment true found (leaks gateway fields):"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No payment field leaks"

      - name: .env files are gitignored
        run: |
          if git ls-files --cached apps/api/.env apps/web/.env 2>/dev/null | grep -q ".env"; then
            echo "❌ FAILED: .env files are tracked by git"
            exit 1
          fi
          echo "✅ .env files not tracked"

  # ─── Stage 3: Build Docker Images ──────────────────────────────
  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    needs: [typecheck, audit, secrets, prisma, security, lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build API Docker image
        working-directory: apps/api
        run: docker build -t jadwal-api:${{ github.sha }} .

  build-web:
    name: Build Web Image
    runs-on: ubuntu-latest
    needs: [typecheck, audit, secrets, prisma, security, lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build Web Docker image
        working-directory: apps/web
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.jadwal.com/api' }} \
            -t jadwal-web:${{ github.sha }} .

  # ─── Stage 6: Bundle size budget ───────────────────────────────
  # Catches accidental dependency creep on apps/web. Default budget
  # is 5 MiB of `.next/static`; tighten in scripts/bundle-size-check.sh
  # once the bundle stabilises.
  bundle-size:
    name: Bundle Size
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle size check
        env:
          NEXT_PUBLIC_API_URL: "https://api.placeholder.com/api"
        run: ./scripts/bundle-size-check.sh

  # ─── Stage 4: Deploy to AWS (main branch only) ─────────────────
  # Uses short-lived OIDC credentials — no long-lived AWS access keys stored
  # in GitHub secrets. The role ARN is public (it's just an identifier; trust
  # is enforced by the OIDC trust policy in AWS).
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write   # required for OIDC federation
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-deploy-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION || 'me-south-1' }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API image
        working-directory: apps/api
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/jadwal-api:${{ github.sha }} -t $ECR_REGISTRY/jadwal-api:latest .
          docker push $ECR_REGISTRY/jadwal-api:${{ github.sha }}
          docker push $ECR_REGISTRY/jadwal-api:latest

      - name: Build & push Web image
        working-directory: apps/web
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            -t $ECR_REGISTRY/jadwal-web:${{ github.sha }} -t $ECR_REGISTRY/jadwal-web:latest .
          docker push $ECR_REGISTRY/jadwal-web:${{ github.sha }}
          docker push $ECR_REGISTRY/jadwal-web:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster jadwal --service jadwal-api --force-new-deployment
          aws ecs update-service --cluster jadwal --service jadwal-web --force-new-deployment
