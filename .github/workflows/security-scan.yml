name: Security Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  schedule:
    # Weekly full scan on Monday 06:00 UTC — catches newly-disclosed CVEs
    # even on code that hasn't changed.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write   # needed for CodeQL + SARIF upload
  pull-requests: read

jobs:
  # ─── Semgrep — static analysis for OWASP Top 10 + Node.js rules ───
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest@sha256:7810f1d7884974ab6dda7bef8f4a2c8e165ea2142fd8260515d380e4f1407263
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Semgrep
        # Block deploy on ERROR-severity only. WARNING-level rules
        # (njsscan Math.random, regex-DoS heuristic, "string equality
        # could be timing attack") fire on a lot of false positives
        # in this codebase — UI preview keys, bounded character-class
        # regexes, comparisons between two values the user just typed
        # in their own browser. Keeping WARNING in the SARIF upload
        # below means they still appear in the Security tab for
        # review; they just don't gate CI.
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/nodejsscan \
            --config=p/typescript \
            --config=p/react \
            --config=p/javascript \
            --config=p/secrets \
            --error \
            --severity=ERROR \
            --sarif --output=semgrep.sarif \
            apps/
      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ─── retire.js — known-vulnerable JS libs in node_modules AND bundle ───
  retirejs:
    name: retire.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install retire
        run: npm install -g retire

      - name: Retire scan — API
        run: retire --path apps/api --severity high --exitwith 1

      - name: Retire scan — Web
        run: retire --path apps/web --severity high --exitwith 1

  # ─── CodeQL — GitHub's own deep static analysis ───
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3
        with:
          category: "/language:${{ matrix.language }}"

  # ─── npm audit — one more time, with signatures verified ───
  npm-audit:
    name: npm audit (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install with frozen lockfile
        run: npm ci
      - name: Verify package integrity signatures
        run: npm audit signatures
      - name: API audit (production deps)
        working-directory: apps/api
        run: npm audit --omit=dev --audit-level=high
      - name: Web audit (production deps)
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
